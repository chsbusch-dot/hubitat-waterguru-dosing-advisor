<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">The physical dosing path</title>
<desc id="desc">Sodium hypochlorite travels from a 15 gallon reservoir through a suction strainer and continuous tube to the Kamoer pump, then through discharge tubing and a check valve into the pool. The valve is submerged near, but not connected to, the wall return. Power and control are shown separately in Figure 03. Internal pickup is schematic; elevations are not specified.</desc>
