<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
<title id="title">Power, data and control</title>
<desc id="desc">WaterGuru measurements reach the vendor cloud and the Hubitat integration and advisor. Hubitat sends ON and OFF commands to the Zooz ZEN05 and receives switch and power reports. Required protected AC runs through the plug to the matched 24 volt adapter and pump. Planned runtime and emergency cutoff are Hubitat software controls; the plug local timer is separate but all depend on the same outlet relay.</desc>
