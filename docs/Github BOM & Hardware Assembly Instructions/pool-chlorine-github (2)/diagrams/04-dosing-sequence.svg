<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" role="img" aria-labelledby="title desc">
<title id="title">From measurement to confirmed shutdown</title>
<desc id="desc">Advisory mode calculates only. Approval waits for the operator; Auto can authorize an eligible sample. Guards must pass before allowance is reserved, timers are armed and ON is requested. Fresh ON and adequate power confirm a start on this power-reporting plug. Failure causes OFF and a latched fault. A monitored run ends with an OFF request; without fresh OFF confirmation, retries and cutoff protection remain active. Usage is estimated, not metered.</desc>
<rect x="0" y="0" width="1400" height="1700" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<rect x="0" y="0" width="1400" height="12" rx="0" fill="#007F79" stroke="none" stroke-width="1.5"/>
<text x="48" y="54" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#007F79">POOL CHLORINE DOSING  /  FIGURE 04</text>
<text x="48" y="102" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#142C3E">From measurement to confirmed shutdown</text>
<text x="48" y="140" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526774">Normal dosing and fault recovery in WaterGuru Dosing Advisor 2.5.0.</text>
<rect x="48" y="177" width="410" height="110" rx="14" fill="#F7FAFC" stroke="#CDD9DF" stroke-opacity="1" stroke-width="1.5"/>
<text x="253.0" y="210" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142C3E">ADVISORY</text>
<text x="253.0" y="241" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526774">Calculate and notify; no pump start</text>
<rect x="480" y="177" width="410" height="110" rx="14" fill="#F0EBFA" stroke="none" stroke-width="1.5"/>
<text x="685.0" y="210" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142C3E">APPROVAL</text>
<text x="685.0" y="241" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526774">Operator authorizes the pending dose</text>
<rect x="912" y="177" width="440" height="110" rx="14" fill="#F0EBFA" stroke="none" stroke-width="1.5"/>
<text x="1132.0" y="210" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142C3E">AUTO</text>
<text x="1132.0" y="241" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526774">Eligible sample may authorize a dose</text>
<rect x="90" y="324" width="700" height="82" rx="14" fill="#F7FAFC" stroke="#CDD9DF" stroke-opacity="1" stroke-width="1.5"/>
<text x="440.0" y="357" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#142C3E">New sample + run authorization</text>
