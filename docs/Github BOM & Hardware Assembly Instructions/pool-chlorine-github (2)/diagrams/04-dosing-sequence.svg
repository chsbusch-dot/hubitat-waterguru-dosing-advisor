<polygon points="440,438 446.0,426.0 434.0,426.0" fill="#007F79" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<polygon points="440,438.0 790.0,502 440,566.0 90.0,502" fill="#FFF4DE" stroke="#99620A" stroke-opacity="1" stroke-width="2" stroke-linejoin="round"/>
<text x="440" y="495" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142C3E">All dosing guards pass?</text>
<text x="440" y="526" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#526774">Mode, sample, circulation, chemistry and limits</text>
<path d="M 790 502 L 930 502" fill="none" stroke="#A74135" stroke-opacity="1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="930,502 918.0,496.0 918.0,508.0" fill="#A74135" stroke="none" stroke-width="2" stroke-linejoin="round"/>
<text x="842" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#A74135">NO</text>
<rect x="930" y="454" width="422" height="105" rx="14" fill="#FCECE8" stroke="none" stroke-width="1.5"/>
<text x="1141.0" y="487" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142C3E">Hold and report why</text>
<text x="1141.0" y="518" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#526774">No ON request</text>
