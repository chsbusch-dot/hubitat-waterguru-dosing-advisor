<text x="820" y="690" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#007F79">WHAT TO SPECIFY</text>
<text x="820" y="727" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142C3E">• Tube OD and gland grip range</text>
<text x="820" y="756" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142C3E">• Body/seal compatibility with the chemical</text>
<text x="820" y="785" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142C3E">• Cap hole, gasket and mounting details</text>
<text x="820" y="814" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142C3E">• Approved venting for tank and chemical</text>
<text x="820" y="843" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142C3E">• Secure pickup with no kinks or abrasion</text>
<rect x="48" y="911" width="1304" height="129" rx="14" fill="#FFF4DE" stroke="none" stroke-width="1.5"/>
<text x="73" y="948" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#99620A">READ WITH THE ASSEMBLY PHOTOS</text>
<text x="73" y="980" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142C3E">Cap positions and internal geometry are illustrative. No drilling diameter, thread assignment or airtight seal is specified.</text>
<text x="73" y="1009" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#142C3E">Provide dedicated containment. A cable-gland ingress rating does not establish chemical-service approval.</text>
