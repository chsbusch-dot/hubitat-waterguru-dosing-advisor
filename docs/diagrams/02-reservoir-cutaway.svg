<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img" aria-labelledby="title desc">
<title id="title">Reservoir and pickup cutaway</title>
<desc id="desc">A continuous suction tube passes through a gland in one cap and reaches a suction strainer inside the reservoir. Flow is upward toward the pump. The separate cap provides filling access and shows a small vent hole in the photo. Seal materials, mounting dimensions, vent capacity and pickup position require specifications. A separate cross section distinguishes liquid inside the tube from a gland around its outside.</desc>
