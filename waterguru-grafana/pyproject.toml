[project]
name = "waterguru-poller"
version = "0.1.0"
description = "Daily poller that pulls the unofficial WaterGuru cloud API and writes SmartPod readings to InfluxDB 2 for Grafana."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris" }]
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "requests-aws4auth>=1.2",
    "pycognito>=2024.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
waterguru-poll = "waterguru_poller.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["waterguru_poller"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Third-party libraries without type stubs.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "requests_aws4auth", "pycognito", "pycognito.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
