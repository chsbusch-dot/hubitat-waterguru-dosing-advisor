name: attribute contract

# Two layers, because they catch different things:
#
#   contract   -- scans the sources for the attribute names an external historian reads by exact
#                 string. Cheap, and catches a rename.
#   execution  -- runs the app's own methods against a stubbed Hubitat runtime. Needed because a
#                 text scan cannot tell a real sendEvent from a commented-out one, and cannot see
#                 behaviour at all: a stopDose() that reported "pump stopped" after a FAILED OFF
#                 command passed the text scan happily.
#
# Neither touches a hub or a pump.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies: the check is regex over two Groovy files.
      - name: Enforce the tile attribute contract
        run: python tests/test_attribute_contract.py

  execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner has docker, and the harness uses the same groovy:4-alpine image locally, so
      # there is no Groovy to install and no version drift between here and a laptop.
      - name: Run the app's methods against a stubbed Hubitat runtime
        run: ./tests/groovy/run.sh
